# hypridle — dim → lock → screen off → suspend
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Note: with Hyprland's Lua config, `hyprctl dispatch` takes Lua dispatchers.

general {
    lock_cmd = pidof hyprlock || hyprlock                              # one lock screen at a time
    before_sleep_cmd = loginctl lock-session                           # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' # wake screens after resume
    ignore_dbus_inhibit = false                                        # respect video players etc.
}

# 2.5 min: dim the backlight (no-op on desktops without a backlight)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screens off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

# 30 min: suspend
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
